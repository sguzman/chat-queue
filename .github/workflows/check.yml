name: Chat Queue Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Package only required Firefox add-on files
        run: |
          mkdir -p dist
          zip -q -r dist/chat-queue-fde-qa-unsigned.zip manifest.json src options
          unzip -Z1 dist/chat-queue-fde-qa-unsigned.zip | grep -qx manifest.json
          unzip -Z1 dist/chat-queue-fde-qa-unsigned.zip | grep -qx src/signal.js
      - name: Mozilla web-ext source and manifest lint
        run: |
          mkdir -p dist/extension
          cp manifest.json dist/extension/
          cp -R src options dist/extension/
          npm exec --yes --package=web-ext@10.8.0 -- web-ext lint --source-dir dist/extension --self-hosted --warnings-as-errors --boring
      - uses: actions/upload-artifact@v4
        with:
          name: chat-queue-fde-qa-unsigned
          path: dist/chat-queue-fde-qa-unsigned.zip
          if-no-files-found: error
          retention-days: 14
      # Browser and authenticated Firefox QA are separate gates. This job cannot certify them.
  fde-smoke:
    name: Firefox Developer Edition temporary installation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: fde
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest-devedition
      - uses: browser-actions/setup-geckodriver@5ef1526ed36211ab6cb531ec1cfb11f924ca2dee
        with:
          token: ${{ github.token }}
      - name: Install CI-only WebDriver dependency
        run: npm install --no-save --no-package-lock selenium-webdriver@4.35.0
      - name: Real headless FDE install/uninstall
        env:
          FDE_BINARY: ${{ steps.fde.outputs.firefox-path }}
        run: node tests/fde-smoke.cjs
      - name: Headless FDE synthetic queue HUD and fail-closed test
        env:
          FDE_BINARY: ${{ steps.fde.outputs.firefox-path }}
          CQ_QA_SCREENSHOT_DIR: ${{ runner.temp }}/chat-queue-hud-qa
        run: node tests/fde-synthetic.cjs
      - name: Archive synthetic HUD screenshots for visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-queue-fde-hud-synthetic
          path: ${{ runner.temp }}/chat-queue-hud-qa/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Headless FDE closed HUD and private queue boundary
        env:
          FDE_BINARY: ${{ steps.fde.outputs.firefox-path }}
        run: node tests/fde-privacy.cjs
      - name: Headless FDE cross-tab theme and queue isolation
        env:
          FDE_BINARY: ${{ steps.fde.outputs.firefox-path }}
        run: node tests/fde-theme-sync.cjs
      - name: Check out pinned real Chat Signals v0.3.13 for coexistence QA
        uses: actions/checkout@v4
        with:
          repository: sguzman/chat-signals
          ref: 102e3ea16a9e9535d377c1d4e8b564f5b0fdb721
          path: chat-signals-reference
          persist-credentials: false
      - name: Headless FDE coexistence with real pinned Chat Signals (no automatic Send)
        env:
          FDE_BINARY: ${{ steps.fde.outputs.firefox-path }}
          CHAT_SIGNALS_SOURCE: ${{ github.workspace }}/chat-signals-reference
        run: node tests/fde-coexist.cjs
      - name: Headless FDE authenticated extension messaging with synthetic provider
        env:
          FDE_BINARY: ${{ steps.fde.outputs.firefox-path }}
        run: node tests/fde-signal.cjs
      - name: Headless FDE unauthorized principal and provider spoofing
        env:
          FDE_BINARY: ${{ steps.fde.outputs.firefox-path }}
        run: node tests/fde-principals.cjs
      - name: Headless FDE real event-page idle/restart recovery
        env:
          FDE_BINARY: ${{ steps.fde.outputs.firefox-path }}
        run: node tests/fde-event-page.cjs
      - name: Headless FDE scoped cross-extension API, deny and revocation
        env:
          FDE_BINARY: ${{ steps.fde.outputs.firefox-path }}
        run: node tests/fde-api.cjs
      - name: Headless FDE conditional rule preview sandbox (no send)
        env:
          FDE_BINARY: ${{ steps.fde.outputs.firefox-path }}
        run: node tests/fde-rules.cjs
