name: Chat Queue Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      # Browser and authenticated Firefox QA are separate gates. This job cannot certify them.
