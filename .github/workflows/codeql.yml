name: Chat Queue CodeQL Security Scan
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  codeql:
    name: Independent CodeQL JavaScript security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact repository source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize pinned CodeQL v4.39.0
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze and publish security findings
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:javascript-typescript
          output: ${{ runner.temp }}/chat-queue-codeql-sarif
      - name: Fail closed on unreviewed CodeQL findings or missing results
        run: node scripts/codeql-findings-gate.mjs "${{ runner.temp }}/chat-queue-codeql-sarif"
      - name: Retain machine-readable CodeQL results for independent review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat-queue-codeql-sarif
          path: ${{ runner.temp }}/chat-queue-codeql-sarif/*.sarif
          if-no-files-found: error
          retention-days: 14
